name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build linux
        run: go build ./...
      - name: build windows
        run: GOOS=windows GOARCH=amd64 go build ./cmd/...
